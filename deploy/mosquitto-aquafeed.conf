# Broker MQTT con TLS mutuo (mTLS): cada cliente se identifica con su certificado
# y el CN del certificado se usa como nombre de usuario para las ACL.
listener 8883
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
require_certificate true
use_identity_as_username true

allow_anonymous false
acl_file /etc/mosquitto/aquafeed.acl
