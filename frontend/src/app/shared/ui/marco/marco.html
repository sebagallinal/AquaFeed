<mat-sidenav-container class="af-shell">
  <mat-sidenav
    id="menu-principal"
    class="af-nav"
    [mode]="esMovil() ? 'over' : 'side'"
    [opened]="esMovil() ? menuAbierto() : true"
    (closedStart)="menuAbierto.set(false)"
  >
    <div class="af-nav__inner">
      <a class="af-brand" [routerLink]="inicio()" (click)="cerrarMenu()">
        <img src="logo.svg" width="36" height="36" alt="" />
        <span>
          <strong>AquaFeed</strong>
          <small>{{ area() === 'admin' ? 'Consola' : 'Tus peceras' }}</small>
        </span>
      </a>

      <nav aria-label="Secciones">
        @for (item of items(); track item.ruta) {
          <a
            [routerLink]="item.ruta"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.exacta === true }"
            (click)="cerrarMenu()"
          >
            <mat-icon aria-hidden="true">{{ item.icono }}</mat-icon>
            <span>{{ item.etiqueta }}</span>
            @if (item.badge) {
              <span class="af-nav__badge">
                {{ item.badge }}
                <span class="af-sr">alertas abiertas</span>
              </span>
            }
          </a>
        }
      </nav>

      <div class="af-nav__foot">
        <p class="af-nav__who">
          <span class="af-nav__name">{{ usuario()?.nombre }}</span>
          <span class="af-nav__role">{{ usuario()?.email }}</span>
        </p>
        <button type="button" class="af-nav__logout" (click)="salir.emit()">
          <mat-icon aria-hidden="true">logout</mat-icon>
          Cerrar sesión
        </button>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="af-shell__content">
    <header class="af-topbar">
      <button
        type="button"
        class="af-icon-btn"
        (click)="abrirMenu()"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="menu-principal"
        aria-label="Abrir menú"
      >
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
      <span class="af-topbar__brand">AquaFeed</span>
    </header>
    <main id="contenido" class="af-main" tabindex="-1">
      <ng-content />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
